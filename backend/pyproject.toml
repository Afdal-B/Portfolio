[project]
name = "backend"
version = "0.1.0"
description = "Backend API for Afdal Bouraima's portfolio"
authors = [
    {name = "Afdal Bouraima", email = "afdalbouraima@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "pydantic (>=2.9,<3.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "google-genai (>=1.0,<2.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pillow (>=12.3.0,<13.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
